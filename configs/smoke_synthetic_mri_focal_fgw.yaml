defaults:
  - finetune_synthetic_mri_focal_fgw.yaml

experiment:
  name: smoke_synthetic_mri_focal_fgw

runtime:
  workers: 0

data:
  batch_size: 1
  train_augmentation: false
  datasets:
    synthetic_mri:
      train_samples: 2
      validation_samples: 1

training:
  epochs: 1
  checkpoint:
    policy: none
    interval_epochs: 1

loss:
  edge:
    candidates:
      unmatched_warmup_epochs: 0
      unmatched_ramp_epochs: 0

evaluation:
  interval_epochs: 1
