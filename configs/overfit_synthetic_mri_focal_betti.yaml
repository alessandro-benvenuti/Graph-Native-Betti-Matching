defaults:
  - finetune_synthetic_mri.yaml
  - losses/focal.yaml
  - losses/betti.yaml

experiment:
  name: overfit_mri_focal_betti_seed364505

runtime:
  workers: 0

data:
  batch_size: 2
  train_augmentation: false
  datasets:
    synthetic_mri:
      train_samples: 8
      validation_samples: 2

training:
  epochs: 10
  checkpoint:
    policy: best_only

loss:
  edge:
    candidates:
      unmatched_warmup_epochs: 0
      unmatched_ramp_epochs: 0

topology:
  betti_h0:
    warmup_epochs: 0
    ramp_epochs: 0
  betti_h1:
    warmup_epochs: 0
    ramp_epochs: 0

evaluation:
  interval_epochs: 1
