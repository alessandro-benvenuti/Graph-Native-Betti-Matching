defaults:
  - ../../finetune_synthetic_mri.yaml

# Shared settings for the first full-budget focal experiment.  Loss overlays
# inherit this file so dataset, optimizer, scheduler, augmentation, and
# evaluation settings remain identical.
data:
  batch_size: 32
  datasets:
    synthetic_mri:
      train_samples: 4000
      validation_samples: 200

training:
  epochs: 400
  checkpoint:
    policy: interval_and_best
    # Four resumable snapshots plus one overwritten validation-best checkpoint
    # keep the three-run matrix within a practical storage budget.
    interval_epochs: 100

evaluation:
  interval_epochs: 20
