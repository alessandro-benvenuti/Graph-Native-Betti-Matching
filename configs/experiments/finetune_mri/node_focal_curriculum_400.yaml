defaults:
  - full_400.yaml

experiment:
  name: scratch_mri_node_focal_curriculum_400_seed364505

# Exact weighted-CE behavior through 40% of training (gamma=0), a linear
# gamma 0->2 transition from 40% to 70%, then focal gamma=2 to epoch 400.
# Class weights remain fixed so gamma is the only changing variable.
loss:
  node:
    classification:
      name: focal
      class_weights: [0.25, 0.75]
      focal_gamma: 2.0
      curriculum:
        enabled: true
        start_percent: 40.0
        end_percent: 70.0
