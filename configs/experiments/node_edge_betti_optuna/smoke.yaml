defaults:
  - common.yaml

experiment:
  name: node_edge_betti_optuna_smoke_seed364505

data:
  datasets:
    synthetic_mri:
      train_samples: 256
      validation_samples: 128

training:
  epochs: 5
  checkpoint:
    interval_epochs: 5

evaluation:
  interval_epochs: 1

tracking:
  mode: offline
  group: node-edge-betti-optuna-smoke
  tags: [gnbm, node-edge-betti, optuna, smoke, no-scientific-meaning]

optuna:
  study_name: node-edge-betti-pareto-smoke
  n_trials: 4
  metric_aggregation:
    observations: 2
  search_space:
    topology.betti_h0.weight: [0.0, 0.003]
    topology.betti_h1.weight: [0.003, 0.01]
    topology.betti_h1.false_positive_weight: [0.25, 0.5]
    betti_warmup_epochs: [1, 2]
    betti_ramp_epochs: [1, 2]
  sampler:
    population_size: 4
