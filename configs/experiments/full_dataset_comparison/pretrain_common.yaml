defaults:
  - ../../pretrain_mixed.yaml

experiment:
  name: full_dataset_comparison_pretrain_placeholder

data:
  # Per-GPU batch. Four GPUs preserve a global batch of 32.
  batch_size: 8
  validation_batch_size: 32
  mixed_sampling:
    # Visit every Plants and MRI sample once per epoch.
    balance_source_target: false
  datasets:
    plants:
      train_samples: null
      validation_samples: null
    synthetic_mri:
      train_samples: null
      validation_samples: null

training:
  epochs: 50
  checkpoint:
    policy: best_only
    interval_epochs: 50
    latest_interval_epochs: 2

evaluation:
  interval_epochs: 5
  training_metrics:
    enabled: true
    dataset: synthetic_mri
    max_samples: null
    selection_metric: edge_mAP
    selection_mode: max
    save_best_checkpoint: true

