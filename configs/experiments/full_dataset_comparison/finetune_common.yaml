defaults:
  - ../../finetune_synthetic_mri.yaml

experiment:
  name: full_dataset_comparison_finetune_placeholder

data:
  # Per-GPU batch. Four GPUs preserve a global batch of 32.
  batch_size: 8
  validation_batch_size: 32
  datasets:
    synthetic_mri:
      train_samples: null
      validation_samples: null

training:
  epochs: 100
  checkpoint:
    policy: best_only
    interval_epochs: 100
    latest_interval_epochs: 2

evaluation:
  interval_epochs: 5
  training_metrics:
    enabled: true
    dataset: synthetic_mri
    max_samples: null
    selection_metric: edge_mAP
    selection_mode: max
    save_best_checkpoint: true

