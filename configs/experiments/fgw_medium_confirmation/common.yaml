defaults:
  - ../full_dataset_comparison/finetune_nodefocal_edgefocal_mm.yaml

data:
  datasets:
    synthetic_mri:
      train_samples: 8192
      validation_samples: null
      sample_cap_selection: seeded_random
      sample_cap_seed: 364505

training:
  # All trunks and continuations share the same 100-epoch LR horizon.
  epochs: 100
  stop_after_epoch: null
  early_stopping:
    enabled: false
  checkpoint:
    policy: interval
    interval_epochs: 100
    latest_interval_epochs: 5

evaluation:
  interval_epochs: 2
  training_metrics:
    enabled: true
    save_f1_checkpoints: false
    dataset: synthetic_mri
    max_samples: null
    selection_metric: edge_mAP
    selection_mode: max
    save_best_checkpoint: false

tracking:
  group: fgw-medium-confirmation
  tags: [gnbm, fgw, medium-confirmation, samples8192]
