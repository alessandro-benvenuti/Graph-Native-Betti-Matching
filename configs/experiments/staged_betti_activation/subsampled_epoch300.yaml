defaults:
  - screening.yaml

experiment:
  name: staged-betti-subsampled-epoch300-placeholder

tracking:
  tags: [gnbm, staged-betti-activation, topology-subsampling, epoch-300, validation-only]

topology:
  sampling:
    enabled: true
    # H0 is inexpensive enough to supervise every local graph. H1 accounts
    # for about 89% of topology overhead and is sampled without changing its
    # expected loss scale. With two ranks this gives 32 H0 and 4 H1 graphs per
    # global optimizer step.
    max_graphs_per_rank: null
    betti_h0_max_graphs_per_rank: 16
    betti_h1_max_graphs_per_rank: 2

staged_betti:
  # Tune at one mature-but-not-converged checkpoint. Activation timing is
  # tested separately after selecting one or two configurations.
  branch_epochs: [300]
  screening_epochs: 15
  trials_per_branch: 8
  search_space:
    topology.betti_h0.weight: [0.001, 0.003, 0.01]
    topology.betti_h1.weight: [0.003, 0.01]
    topology.betti_h1.false_positive_weight: [0.1, 0.25]
    betti_ramp_epochs: [10]
