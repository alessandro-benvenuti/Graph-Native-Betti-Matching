defaults:
  - ../boundary_gamma_sweep_500/finetune_node_focal.yaml
  - ../../losses/betti_node_edge.yaml

experiment:
  name: staged_betti_activation_placeholder
  seed: 364505

data:
  batch_size: 32
  validation_batch_size: 32
  datasets:
    synthetic_mri:
      train_samples: null
      validation_samples: null

training:
  epochs: 500
  stop_after_epoch: null
  early_stopping:
    enabled: false
  checkpoint:
    policy: interval_and_best
    interval_epochs: 100
    latest_interval_epochs: 1
    milestone_epochs: []

evaluation:
  interval_epochs: 5
  training_metrics:
    enabled: true
    dataset: synthetic_mri
    max_samples: null
    selection_metric: edge_mAP
    selection_mode: max
    save_best_checkpoint: true
    save_f1_checkpoints: true

tracking:
  project: gnbm
  group: staged-betti-activation
  tags: [gnbm, staged-betti-activation, validation-only]

topology:
  complex:
    mode: node_aware
    aggregation: hybrid
    alpha: 0.5
    detach_unmatched_edge_probabilities: true
  betti_h0:
    enabled: true
    log_only: false
    normalization: matched_mean
    warmup_epochs: 0
    activation_epoch: null
  betti_h1:
    enabled: true
    log_only: false
    normalization: matched_mean
    warmup_epochs: 0
    activation_epoch: null
    false_negative_weight: 1.0

staged_betti:
  branch_epochs: [200, 300, 400]
  screening_epochs: 50
  trials_per_branch: 10
  metric_aggregation:
    name: tail_mean
    observations: 3
  search_space:
    topology.betti_h0.weight: [0.001, 0.003, 0.01]
    topology.betti_h1.weight: [0.003, 0.01, 0.03]
    topology.betti_h1.false_positive_weight: [0.1, 0.25]
    betti_ramp_epochs: [10, 20]
  sampler:
    name: nsga2
    population_size: 4
    seed: 364505

