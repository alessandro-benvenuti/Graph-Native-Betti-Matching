defaults:
  - ../../finetune_synthetic_mri.yaml

# MRI specialization begins from the corresponding mixed-pretraining best
# checkpoint.  Best-only storage bounds the seven-recipe matrix to one
# checkpoint per stage and recipe; that checkpoint contains full resume state.
experiment:
  name: focal_matrix_finetune_placeholder

data:
  batch_size: 32
  datasets:
    synthetic_mri:
      train_samples: null
      validation_samples: null

training:
  epochs: 600
  checkpoint:
    policy: best_only
    interval_epochs: 600

evaluation:
  interval_epochs: 20
  training_metrics:
    enabled: true
    dataset: synthetic_mri
    max_samples: null
    selection_metric: edge_mAP
    selection_mode: max
    save_best_checkpoint: true
