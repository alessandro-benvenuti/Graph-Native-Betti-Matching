defaults:
  - finetune_synthetic_mri.yaml

experiment:
  name: finetune_synthetic_mri_focal

loss:
  node:
    classification:
      name: focal
      class_weights: [0.25, 0.75]
      focal_gamma: 2.0
  edge:
    classification:
      name: focal
      class_weights: [1.0, 1.0]
      focal_gamma: 2.0
    candidates:
      max_per_graph: 9999
      positive_cap: null
      include_unmatched: true
      unmatched_object_threshold: 0.25
      max_active_unmatched: 32
      max_unmatched_pairs_per_graph: 256
      unmatched_weight: 1.0
      unmatched_warmup_epochs: 0
      unmatched_ramp_epochs: 10
    balancing:
      mode: none
