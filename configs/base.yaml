schema_version: 1

experiment:
  name: null
  seed: 364505
  output_dir: "${GNBM_OUTPUT_DIR}"

runtime:
  device: cuda
  distributed: false
  deterministic: false
  workers: 4
  pin_memory: true

tracking:
  enabled: true
  project: focal-loss
  entity: null
  group: null
  tags: [gnbm]
  mode: null
  save_code: true

data:
  spatial_dims: 3
  image_size: [64, 64, 64]
  batch_size: 48
  train_augmentation: true
  mixed_sampling:
    balance_source_target: true
  datasets: {}

augmentation:
  coordinate_order: [D, H, W]
  normalization_denominator: axis_size
  synthetic_mri:
    rotate_90:
      enabled: true
      planes: [[D, H], [D, W], [H, W]]
    zoom:
      enabled: true
      range: [0.6, 1.0]
      image_interpolation: trilinear
      segmentation_interpolation: nearest
    gaussian_noise:
      enabled: true
      probability: 0.35
      std_range: [0.0, 0.015]
    intensity_clamp: [-0.5, 0.5]
  plants:
    projection_depth: 5
    padding: 5
    rotate_90:
      enabled: true
      planes: [[D, H], [D, W], [H, W]]
    flip:
      enabled: true
      axes: [D, H, W]
      probability_per_axis: 0.5
    intensity_scale: [-0.5, 0.5]
    pad_to_image_size: true

model:
  num_classes: 2
  encoder:
    type: se_resnet
    input_channels: 1
    depths: [4, 4, 16, 4]
    # Effective legacy behavior: the old code ignored the first configured 2.
    strides: [1, 2, 2, 2]
  decoder:
    type: deformable_detr
    hidden_dim: 552
    attention_heads: 6
    # Effective legacy behavior: the old builder omitted this argument and the
    # transformer constructor therefore used its default of 6.
    encoder_layers: 6
    decoder_layers: 4
    feedforward_dim: 1280
    dropout: 0.0
    activation: relu
    feature_levels: 1
    decoder_points: 4
    encoder_points: 4
    object_queries: 120
    relation_tokens: 2
    dummy_tokens: 0
    relation_attention: true
    use_cuda_extension: true
  matcher:
    type: hungarian
    class_cost: 2.0
    node_cost: 5.0

training:
  input: image
  start_epoch: 0
  epochs: null
  warmup_epochs: 1
  optimizer:
    name: adamw
    base_lr: 7.0e-5
    weight_decay: 1.0e-4
    epsilon: 1.0e-8
    betas: [0.9, 0.999]
  scheduler:
    name: polynomial
    warmup_lr: 1.0e-9
    power: 0.9
  checkpoint:
    policy: interval_and_best
    interval_epochs: 5

loss:
  enabled: [boxes, class, cardinality, nodes, edges]
  supervise_target_graphs: true
  weights:
    boxes: 3.0
    class: 4.0
    cardinality: 0.8
    nodes: 2.0
    edges: 6.0
  node:
    classification:
      name: weighted_cross_entropy
      class_weights: [0.25, 0.75]
      focal_gamma: 2.0
      curriculum:
        enabled: false
        start_percent: 10.0
        end_percent: 30.0
  edge:
    classification:
      name: cross_entropy
      class_weights: [1.0, 1.0]
      focal_gamma: 2.0
      curriculum:
        enabled: false
        start_percent: 10.0
        end_percent: 30.0
    candidates:
      max_per_graph: 9999
      positive_cap: null
      include_unmatched: false
      unmatched_object_threshold: 0.25
      max_active_unmatched: 32
      max_unmatched_pairs_per_graph: 256
      unmatched_weight: 1.0
      unmatched_warmup_epochs: 0
      unmatched_ramp_epochs: 0
    balancing:
      mode: ratio_upsample
      positive_to_negative_ratio: 0.15
      tolerance: 0.02

topology:
  betti_h0:
    enabled: false
    log_only: true
    weight: 0.0
    warmup_epochs: 0
    ramp_epochs: 0
    unmatched_weight: 1.0
    diagonal_factor: 0.5
    normalize: true
  betti_h1:
    enabled: false
    log_only: true
    weight: 0.0
    warmup_epochs: 0
    ramp_epochs: 0
    false_positive_weight: 1.0
    false_negative_weight: 1.0
    diagonal_factor: 0.5
    normalize: true

evaluation:
  interval_epochs: 5
  node_threshold: null
  edge_threshold: null
  bn_calibration_batches: 0
  training_metrics:
    enabled: false
    dataset: synthetic_mri
    max_samples: 200
    selection_metric: edge_mAP
    selection_mode: max
    save_best_checkpoint: false
  protocol:
    iou_thresholds: [0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
    max_detections: 40
    target_node_size: 0.2
    edge_half_width: 0.1
    smd_points: 100
    smd_epsilon: 1.0e-7
    smd_iterations: 100
    folds: 5
